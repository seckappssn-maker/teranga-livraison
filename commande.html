<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Mise en page : une colonne de téléphone. Bandeau bleu nuit en haut (nom de la société, zones), cartes de courses avec une bande de couleur par étape (jaune nouvelle, vert en route, bleu récupéré, orange livré), barre d'onglets en bas pour le capo. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E2E7EF; --ink:#0F1B2E; --muted:#56627A; --line:#D3DAE5;
  --brand:#0E2A57; --brand-ink:#FFFFFF; --brand-soft:#C9D6EE;
  --sun:#FFC21A; --sun-ink:#2A1E00; --sun-soft:#FFF1C7;
  --go:#0F7A4F; --go-soft:#DBF0E6; --pick:#1F5BD6; --pick-soft:#E0E9FB;
  --done:#C9561A; --done-soft:#FBE6D8; --bad:#B42318; --bad-soft:#FBE2DF; --on:#FFFFFF;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121E; --surface:#131D2D; --sunk:#1A2640; --ink:#E8EDF5; --muted:#9AA7BC; --line:#263349;
  --brand:#10244A; --brand-ink:#EAF0FA; --brand-soft:#8FA6CF;
  --sun:#FFC94A; --sun-ink:#241A00; --sun-soft:#3A3010;
  --go:#46C48C; --go-soft:#12352A; --pick:#7DA4FF; --pick-soft:#172848;
  --done:#FF9A55; --done-soft:#3A2312; --bad:#F07A6E; --bad-soft:#3A1C19; --on:#0B121E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B121E; --surface:#131D2D; --sunk:#1A2640; --ink:#E8EDF5; --muted:#9AA7BC; --line:#263349;
  --brand:#10244A; --brand-ink:#EAF0FA; --brand-soft:#8FA6CF;
  --sun:#FFC94A; --sun-ink:#241A00; --sun-soft:#3A3010;
  --go:#46C48C; --go-soft:#12352A; --pick:#7DA4FF; --pick-soft:#172848;
  --done:#FF9A55; --done-soft:#3A2312; --bad:#F07A6E; --bad-soft:#3A1C19; --on:#0B121E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:800}
h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);margin:22px 0 10px}
.muted{color:var(--muted)} .small{font-size:14px}
/* bandeau */
.top{position:relative;z-index:5;background:var(--brand);color:var(--brand-ink)}
.top .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.demo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--brand-soft)}
.demo b{font-weight:700;margin-right:2px}
.demo button{border:1px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);background:transparent;color:var(--brand-ink);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.demo button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none;border-radius:23%;box-shadow:0 0 0 1.5px rgba(255,255,255,.22),0 3px 12px rgba(0,0,0,.25)}
.logo .n{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1}
.logo .s{font-size:13px;color:var(--brand-soft)}
.zones{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.zones button{border:0;background:color-mix(in srgb,var(--brand-ink) 12%,transparent);color:var(--brand-ink);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.zones button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
main{padding-block:14px 110px}
/* boutons */
.b{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;text-decoration:none;line-height:1.2}
.b-sun{background:var(--sun);color:var(--sun-ink)}
.b-go{background:var(--go);color:var(--on)} .b-pick{background:var(--pick);color:var(--on)} .b-done{background:var(--done);color:var(--on)}
.b-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.b-soft{background:var(--sunk);color:var(--ink)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-big{padding:18px 16px;font-size:19px;border-radius:16px}
.b-sm{padding:9px 12px;font-size:14px;border-radius:11px;width:auto;display:inline-flex}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.b{flex:1 1 140px;width:auto}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* pastilles */
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:800;white-space:nowrap}
.p-nouvelle{background:var(--sun-soft);color:var(--ink)} .p-off{background:var(--sunk);color:var(--muted)} .p-prise{background:var(--go-soft);color:var(--go)}
.p-recuperee{background:var(--pick-soft);color:var(--pick)} .p-livree{background:var(--done-soft);color:var(--done)} .p-annulee{background:var(--bad-soft);color:var(--bad)}
/* cartes de course */
.course{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 18px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.course::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--stripe)}
.s-nouvelle{--stripe:var(--sun)} .s-prise{--stripe:var(--go)} .s-recuperee{--stripe:var(--pick)} .s-livree{--stripe:var(--done)} .s-annulee{--stripe:var(--bad);opacity:.7}
.c-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-no{font-family:var(--display);font-weight:800;font-size:19px}
.c-meta{font-size:13px;color:var(--muted);flex:1;min-width:0}
.route{display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.route div{display:flex;gap:8px;align-items:baseline;min-width:0}
.route span.k{flex:none;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:62px}
.route .v{min-width:0;overflow-wrap:anywhere}
.money{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14.5px;color:var(--muted)}
.money b{color:var(--ink)}
.cod{background:var(--sun-soft);color:var(--ink);border-radius:12px;padding:9px 12px;font-weight:700;font-size:15px}
.who{font-size:14.5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.vocal{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700}
.vocal audio{width:100%;height:40px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-block:12px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-weight:700;font-size:14px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-weight:800;font-size:20px;margin-top:2px}
/* livreurs */
.lv{display:flex;gap:12px;align-items:center}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--sunk);position:relative}
.av i{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--surface);background:var(--muted)}
.av i.on{background:var(--go)}
.lv .main{flex:1;min-width:0}
.lv .t{font-weight:800}
.lv .s{font-size:13.5px;color:var(--muted)}
.code{font-family:var(--display);font-weight:800;letter-spacing:.18em}
/* caisse */
.ca-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.ca-row:first-of-type{border-top:0}
.ca-row b{white-space:nowrap}
.due{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:12px;margin-top:6px}
.due .v{font-family:var(--display);font-weight:800;font-size:24px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daynav b{font-family:var(--display);font-size:19px}
/* formulaires */
.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer}
.chips input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips input:focus-visible+span{outline:3px solid var(--pick);outline-offset:2px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.note{background:var(--sun-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14.5px}
.note.blue{background:var(--pick-soft)}
/* onglets du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted);position:relative}
.tabs button span.i{font-size:21px;line-height:1}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--sun)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--on);font-size:11.5px;font-weight:800;display:grid;place-items:center}
/* feuille du bas */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(6,12,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
/* livreur */
.dispo{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:16px;padding:14px 16px;font-weight:800;font-size:18px;border:0;width:100%;text-align:left}
.dispo.on{background:var(--go);color:var(--on)} .dispo.off{background:var(--sunk);color:var(--ink)}
.dispo small{display:block;font-weight:600;font-size:13.5px;opacity:.85}
.knob{flex:none;width:58px;height:34px;border-radius:99px;background:color-mix(in srgb,currentColor 25%,transparent);position:relative}
.knob::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:currentColor;transition:transform .15s}
.dispo.on .knob::after{transform:translateX(24px)}
/* client */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:28px;font-weight:800;line-height:1.1}
.hero p{margin:0;color:var(--brand-soft)}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big4 .b{flex-direction:column;padding:18px 10px;font-size:16px;border-radius:18px;min-height:104px}
.big4 .b .i{font-size:30px;line-height:1}
.big4 .b small{font-weight:600;font-size:13px;opacity:.85}
.recbtn{width:132px;height:132px;border-radius:50%;border:0;margin:6px auto;display:grid;place-items:center;background:var(--bad);color:var(--on);font-weight:800;font-size:15px;box-shadow:0 0 0 10px var(--bad-soft)}
.recbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px var(--bad-soft)}}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}.knob::after{transition:none}}
.timer{text-align:center;font-family:var(--display);font-weight:800;font-size:26px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;position:relative}
.step .d{flex:none;width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:var(--surface);margin-top:1px;z-index:1}
.step:not(:last-child)::after{content:"";position:absolute;left:10px;top:22px;bottom:0;width:3px;background:var(--line)}
.step.ok .d{background:var(--go);border-color:var(--go)}
.step.ok:not(:last-child)::after{background:var(--go)}
.step.now b{color:var(--go)}
.num{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.03em;user-select:all}
.hint{font-size:13.5px;color:var(--muted)}
/* photo de profil et couverture de l'abonné */
.blogo{flex:none;border-radius:50%;object-fit:cover;background:var(--surface);box-shadow:0 0 0 2px var(--brand-ink)}
.cover{position:relative;width:100%;aspect-ratio:16/9;max-height:240px;border-radius:20px;overflow:hidden;background:var(--brand)}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
.cover-in{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;display:flex;align-items:center;gap:12px;color:#fff;min-width:0}
.cover-in b{display:block;font-family:var(--display);font-size:23px;line-height:1.15;text-shadow:0 1px 4px rgba(0,0,0,.5);overflow-wrap:anywhere}
.cover-in span{font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cover-in .blogo{box-shadow:0 0 0 3px #fff}
.ip{position:relative;padding-bottom:32px}
.ip-cover{display:grid;place-items:center;width:100%;aspect-ratio:16/7;border-radius:14px;overflow:hidden;border:1.5px dashed var(--line);background:var(--bg);color:var(--muted);font-weight:700;cursor:pointer}
.ip-cover img,.ip-logo img{width:100%;height:100%;object-fit:cover}
.ip-logo{position:absolute;left:14px;bottom:0;width:76px;height:76px;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:3px solid var(--surface);background:var(--sunk);box-shadow:0 0 0 1.5px var(--line);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;text-align:center}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* compléments de la version en ligne */
html,body{min-height:100%}
.tabs .wrap{grid-template-columns:repeat(var(--ntabs,5),1fr)}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:var(--sun-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14.5px;font-weight:600;margin-bottom:12px}
.banner.blue{background:var(--pick-soft)}
.banner.red{background:var(--bad-soft);color:var(--bad)}
.net{position:fixed;left:0;right:0;top:0;z-index:30;text-align:center;font-size:13px;font-weight:800;padding:calc(4px + env(safe-area-inset-top,0px)) 12px 5px;background:var(--bad);color:var(--on)}
.net.sync{background:var(--pick)}
.start{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.start .hero h1{font-size:30px}
.auth{display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-weight:700;font-size:14.5px;min-height:1.2em}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:5px;border-radius:14px}
.seg2 button{border:0;border-radius:10px;padding:11px 8px;font-weight:800;background:transparent;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv b{text-align:right}
.codebig{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.3em;text-align:center;padding:10px;border-radius:14px;background:var(--go-soft);color:var(--go)}
.pinput{font-size:28px;text-align:center;letter-spacing:.35em;font-family:var(--display);font-weight:800}
.photo-prev{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block}
.month{display:flex;align-items:center;justify-content:space-between;gap:10px}
.month b{font-family:var(--display);font-size:19px;text-transform:capitalize}
.rep td,.rep th{padding:7px 6px;text-align:right;font-size:14px;white-space:nowrap;border-top:1px solid var(--line)}
.rep th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0}
.rep td:first-child,.rep th:first-child{text-align:left;white-space:normal}
.rep{width:100%;border-collapse:collapse}
.tbl{overflow-x:auto;margin-inline:-4px}

<script>
/* ======================================================================

   (numéro + code), page des clients (commande.html) et page de celui qui
   reçoit le colis. Les données sont dans Supabase (tables liv_).
   ====================================================================== */
'use strict';
const SUPA_URL='https://ncsjgmkrsvtwklfrdbgy.supabase.co', SUPA_KEY='sb_publishable_oDE4BbU6J3RTnce1Oo91cQ_hokWgh0U';
const MAIL_DOM='@terangalivraison.app', SUPPORT='778790006';
const SITE='https://seckappssn-maker.github.io/teranga-livraison/';
const PUSH_PUB='BLcHXOxXIRWkIBKizjrAQ0pRpNURUxUGiIlzYgHCGH-aAKLeiGsoL_thiuzOrPAUaF6lWhgOtBFTajqAcmO6sB8';
const PAGE=window.TL_PAGE||'app';
const Q=new URLSearchParams(location.search);

// ===== outils =====
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const dayOf=t=>t?iso(new Date(+t)):'';
const hhmm=t=>{if(!t)return '';const d=new Date(+t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fdate=s=>{if(!s)return '';const [y,m,d]=s.split('-');if(s===today())return "Aujourd'hui";const y2=new Date();y2.setDate(y2.getDate()-1);if(s===iso(y2))return 'Hier';return d+'/'+m+'/'+y;};
const fdateL=s=>{if(!s)return '';const [y,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+y;};
const F=n=>Math.round(n||0).toLocaleString('fr-FR').replace(/[\s\u202f\u00a0]/g,'\u00a0')+'\u00a0F';
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n;};
const rnd=n=>{const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const b=new Uint8Array(n);(crypto||window.msCrypto).getRandomValues(b);for(const x of b)s+=a[x%a.length];return s;};
const uid=()=>rnd(16);
const pin4=()=>{const b=new Uint8Array(2);crypto.getRandomValues(b);return String(((b[0]<<8)|b[1])%10000).padStart(4,'0');};
const digits=p=>String(p||'').replace(/\D/g,'');
function codeOf(v){v=String(v||'').trim();const m=v.match(/[?&](?:livreur|c)=([^&#\s]+)/);if(m)v=decodeURIComponent(m[1]);return v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);}
function tel9(p){let d=digits(p);if(d.startsWith('00221'))d=d.slice(5);else if(d.startsWith('221')&&d.length===12)d=d.slice(3);return d;}
function waNum(p){let d=digits(p);if(d.startsWith('00'))d=d.slice(2);if(d.length===9&&d[0]==='7')d='221'+d;return d;}
const telFmt=p=>{const d=waNum(p);const m=d.match(/^221(\d\d)(\d{3})(\d\d)(\d\d)$/);return m?m.slice(1).join(' '):(p||'');};
const waLink=(p,t)=>'https://wa.me/'+waNum(p)+(t?'?text='+encodeURIComponent(t):'');
const waShare=t=>'https://wa.me/?text='+encodeURIComponent(t);
const telLink=p=>'tel:+'+waNum(p);
const posOk=p=>p&&isFinite(p.lat)&&isFinite(p.lng);
const mapLink=(q,z,pos)=>posOk(pos)?'https://www.google.com/maps/dir/?api=1&destination='+pos.lat+','+pos.lng:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+(z?', '+z:'')+', Sénégal');
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const initials=n=>String(n||'?').split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
const imgOk=u=>/^(https:\/\/|data:image\/)/.test(u||'');
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
let toastT=null;
function toast(m){clearTimeout(toastT);let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;toastT=setTimeout(()=>t.remove(),3000);}
function copy(txt,okMsg){const done=()=>toast(okMsg||'Copié');try{navigator.clipboard.writeText(txt).then(done,fb);}catch(e){fb();}
  function fb(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('Sélectionnez le texte et copiez-le');}ta.remove();}}
function buzz(){try{navigator.vibrate&&navigator.vibrate([200,80,200]);}catch(e){}}
function isNet(e){const m=String(e&&e.message||e||'');return !navigator.onLine||/fetch|network|Failed|Load failed|NetworkError|timeout/i.test(m);}
function errMsg(e){const m=String(e&&e.message||e||'');if(isNet(e))return 'Pas d\'internet : réessayez';
  if(/Invalid login|credentials/i.test(m))return 'Numéro ou mot de passe incorrect';
  if(/already registered|already been registered|exists/i.test(m))return 'Ce numéro a déjà un compte : touchez « Entrer »';
  if(/Password should be/i.test(m))return 'Mot de passe : 6 caractères minimum';
  return m.replace(/^.*?ERROR:\s*/,'')||'Erreur';}
function readPhoto(f,cb,max,q){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q||.8));};im.onerror=()=>toast('Cette image ne s\'ouvre pas');im.src=fr.result;};fr.readAsDataURL(f);}
function dataUrlBlob(u){const a=u.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]);let n=b.length;const x=new Uint8Array(n);while(n--)x[n]=b.charCodeAt(n);return new Blob([x],{type:m});}

// ===== Supabase =====
let SB=null;
function initSB(){if(SB)return SB;if(!window.supabase)return null;SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'tl-auth'}});return SB;}
function whenSB(cb){const t0=Date.now();(function w(){if(initSB())return cb();if(Date.now()-t0>9000){NETMSG='Pas d\'internet : l\'app s\'ouvre quand le réseau revient';render();return;}setTimeout(w,150);})();}
async function rpc(fn,args){const r=await SB.rpc(fn,args||{});if(r.error)throw r.error;return r.data;}

// ===== état général =====
let MODE='start';           // start · auth · capo · demo · membre · public · dest · locked
let USER=null, ACC=null, NETMSG='';
const V={tab:'courses',zf:'',cf:'actives',cd:'',cm:'',auth:{su:false,nom:'',ville:'',tel:'',pw:'',pw2:''},mlog:{code:'',tel:'',pin:''},busy:false,pushOn:false};

// ===== Données du capo : S (même forme pour le capo et le capo de zone) =====
let S={ent:{},courses:{},membres:{},versements:{},depenses:{}};
const COLS=['courses','membres','versements','depenses'];
const L=col=>Object.values(S[col]||{});
const lv=id=>S.membres[id];
const crs=id=>S.courses[id];
const livreurs=()=>L('membres').filter(m=>(m.role||'livreur')==='livreur');
const actif=c=>c.statut==='prise'||c.statut==='recuperee';
const inZone=x=>!V.zf||x.zone===V.zf;
const zones=()=>(S.ent.zones&&S.ent.zones.length?S.ent.zones:['Touba']);
const libreOk=()=>S.ent.mode!=='capo';
const isZoneMgr=()=>MODE==='membre'&&MV&&MV.role==='zone';
const canAdmin=()=>MODE==='capo'||MODE==='demo';
const SOLO_ID='moi';
const solo=()=>!!S.ent.solo&&canAdmin();

// ----- synchronisation du capo (fonctionne sans internet : les changements attendent dans OPS) -----
let OPS=[], LAST='', FLUSHING=false, PULLING=false, PULLT=null, FLUSHT=null, SEEN={};
const K=(n)=>'tl-'+n+'-'+(USER?USER.id.slice(0,8):'demo');
function persistS(){if(MODE==='demo'){lsSet('tl-demo',S);return;}if(!USER)return;lsSet(K('s'),S);lsSet(K('ops'),OPS);lsSet(K('last'),LAST);}
function loadS(){S=lsGet(K('s'),null)||{ent:{},courses:{},membres:{},versements:{},depenses:{}};COLS.forEach(c=>{S[c]=S[c]||{};});S.ent=S.ent||{};OPS=lsGet(K('ops'),[]);LAST=lsGet(K('last'),'');}
function applyLocal(op){if(op.col==='set'){if(op.id==='ent')S.ent=Object.assign({},S.ent,op.patch);return;}
  if(op.del){delete S[op.col][op.id];return;}S[op.col][op.id]=Object.assign({},S[op.col][op.id],op.patch);}
function put(col,id,patch){
  if(MODE==='demo'){applyLocal({col,id,patch});persistS();return;}
  const op={col,id,patch};applyLocal(op);OPS.push(op);persistS();schedFlush();}
function del(col,id){
  if(MODE==='demo'){applyLocal({col,id,del:true});persistS();return;}
  const op={col,id,del:true};applyLocal(op);OPS.push(op);persistS();schedFlush();}
function schedFlush(){clearTimeout(FLUSHT);FLUSHT=setTimeout(flush,400);}
async function flush(){
  if(MODE!=='capo'||FLUSHING||!OPS.length)return;if(!navigator.onLine||!SB){netBar();return;}
  FLUSHING=true;const batch=OPS.slice(0,250);
  try{await rpc('liv_put',{p_ops:batch});OPS.splice(0,batch.length);persistS();FLUSHING=false;
    if(OPS.length)return flush();await pull();}
  catch(e){FLUSHING=false;if(/expiré/i.test(String(e.message||'')))return refreshAcc();if(!isNet(e))console.warn('sync',e);netBar();}
}
async function pull(silent){
  if(MODE!=='capo'||PULLING||!navigator.onLine||!SB)return;PULLING=true;let changed=false,nouv=0;
  try{for(let loop=0;loop<20;loop++){
      let q=SB.from('liv_rows').select('col,id,data,deleted,updated_at').order('updated_at',{ascending:true}).limit(1000);
      if(LAST)q=q.gt('updated_at',LAST);
      const r=await q;if(r.error)throw r.error;const rows=r.data||[];
      for(const x of rows){changed=true;
        if(x.col==='set'){if(x.id==='ent'&&!x.deleted)S.ent=x.data||{};}
        else if(S[x.col]){if(x.deleted)delete S[x.col][x.id];else{
          if(x.col==='courses'&&x.data&&x.data.statut==='nouvelle'&&!SEEN[x.id]&&LAST)nouv++;
          S[x.col][x.id]=x.data;}}
        LAST=x.updated_at;}
      if(rows.length<1000)break;}
    OPS.forEach(applyLocal);
    L('courses').forEach(c=>{if(c.statut==='nouvelle')SEEN[c.id]=1;});
    persistS();
    if(changed&&!silent)renderKeep();
    if(nouv){toast(nouv>1?nouv+' nouvelles courses':'Nouvelle course reçue');buzz();}
  }catch(e){if(!isNet(e))console.warn('pull',e);}
  PULLING=false;netBar();
}
function startPolling(fn,ms){clearInterval(PULLT);PULLT=setInterval(()=>{if(document.visibilityState==='visible')fn();},ms);}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(MODE==='capo'){flush();pull();}else if(MODE==='membre'){replayMQ().then(()=>mRefresh(true));}});
window.addEventListener('online',()=>{netBar();if(MODE==='capo'){flush();pull();}else if(MODE==='membre')replayMQ().then(()=>mRefresh(true));});
window.addEventListener('offline',netBar);
function netBar(){let b=document.querySelector('.net');const pend=MODE==='capo'?OPS.length:MODE==='membre'?MQ.length:0;
  const txt=!navigator.onLine?'Pas d\'internet · '+(pend?pend+' changement'+(pend>1?'s':'')+' en attente':'vous pouvez continuer'):pend?'Envoi des changements…':'';
  if(!txt){if(b)b.remove();return;}if(!b){b=document.createElement('div');b.className='net';b.setAttribute('role','status');document.body.appendChild(b);}
  b.className='net'+(navigator.onLine?' sync':'');b.textContent=txt;}

// ----- compte du capo -----
async function refreshAcc(){try{ACC=await rpc('liv_compte');if(ACC&&!ACC.ok)ACC=await rpc('liv_inscription',{p_nom:'',p_ville:''});lsSet(K('acc'),ACC);}catch(e){ACC=ACC||lsGet(K('acc'),null);}
  if(ACC&&ACC.actif===false){MODE='locked';}render();}
async function startCapo(){
  MODE='capo';loadS();ACC=lsGet(K('acc'),null);V.tab=V.tab||'courses';render();
  await refreshAcc();if(MODE!=='capo')return;
  await flush();await pull(true);render();uploadImgs();
  startPolling(()=>{flush();pull();},10000);pushCheck();
}
function startDemo(){MODE='demo';USER=null;S=lsGet('tl-demo',null)||demoSeed();ACC={ok:true,actif:true,formule:'premium',code:'demo',fin:today(),limites:{livreurs:1000,zones:100},demo:true};V.tab='courses';render();}
async function logout(){if(MODE==='capo'){try{await SB.auth.signOut();}catch(e){}lsDel('tl-auth');}
  clearInterval(PULLT);USER=null;ACC=null;lsDel('tl-mem');MEM=null;MV=null;MODE='start';render();}

// ===== Capo de zone et livreurs : numéro + code, actions qui attendent si pas d'internet =====
let MEM=lsGet('tl-mem',null);   // {code, tel, pin}
let MV=lsGet('tl-mv',null);     // dernière vue reçue du serveur
let MQ=lsGet('tl-mq',[]);       // actions en attente
let MSEEN={}, MPOLL=null;
function setMV(v,notify){if(!v||!v.ok)return;const before=MV?new Set((MV.courses||[]).filter(c=>c.statut==='nouvelle'||c.lid===MV.me.id&&actif(c)).map(c=>c.id)):null;
  MV=v;lsSet('tl-mv',MV);vueToS();
  if(notify&&before){const nv=(MV.courses||[]).filter(c=>(c.statut==='nouvelle'||(c.lid===MV.me.id&&actif(c)))&&!before.has(c.id));if(nv.length){toast(nv.length>1?nv.length+' nouvelles courses':'Nouvelle course : N° '+nv[0].no);buzz();}}}
function vueToS(){if(!MV)return;S={ent:MV.ent||{},courses:{},membres:{},versements:{},depenses:{}};
  (MV.courses||[]).forEach(c=>S.courses[c.id]=c);(MV.membres||[]).forEach(m=>S.membres[m.id]=m);
  if(MV.role!=='zone')S.membres[MV.me.id]=MV.me;
  (MV.versements||[]).forEach(x=>S.versements[x.id]=x);(MV.depenses||[]).forEach(x=>S.depenses[x.id]=x);
  MQ.forEach(q=>optim(q.act,q.id,q.arg));}
async function mcall(act,id,arg){const r=await SB.rpc('liv_act',{p_code:MEM.code,p_tel:MEM.tel,p_pin:MEM.pin,p_act:act,p_id:id||'',p_arg:arg||{}});if(r.error)throw r.error;return r.data;}
async function mLogin(code,tel,pin){const r=await SB.rpc('liv_membre',{p_code:code,p_tel:tel,p_pin:pin});if(r.error)throw r.error;return r.data;}
async function mRefresh(notify){if(MODE!=='membre'||!navigator.onLine||!SB||MQ.length)return;
  try{const v=await mcall('vue');setMV(v,notify);renderKeep();}catch(e){if(/incorrect|introuvable/i.test(String(e.message||''))){toast('Votre accès a changé : entrez de nouveau');lsDel('tl-mem');MEM=null;MV=null;MODE='mlogin';render();}else if(/fermé/i.test(String(e.message||''))){MODE='locked';render();}}
}
// petites mises à jour à l'écran avant la réponse du serveur
function optim(act,id,arg){const c=S.courses[id],now=Date.now(),me=MV&&MV.me;arg=arg||{};
  if(act==='dispo'&&me){me.dispo=!!arg.v;if(S.membres[me.id])S.membres[me.id].dispo=!!arg.v;return;}
  if(!c)return;const t=Object.assign({},c.t);
  if(act==='prendre'){c.statut='prise';c.lid=me.id;t.prise=now;}
  if(act==='recup'&&c.statut==='prise'){c.statut='recuperee';t.recup=now;
    if(['cash','wave','om'].includes(arg.pay)&&c.paie!=='dest'&&+c.prix>0){c.payRec=arg.pay;c.payRecM=+c.prix;if(arg.pay!=='cash')c.payRecOk=false;}}
  if(act==='livre'){c.statut='livree';t.livree=now;if(!t.recup)t.recup=now;if(+arg.prix>0&&!(+c.prix)){c.prix=+arg.prix;c.prixLiv=true;}
    if(['cash','wave','om'].includes(arg.pay)&&doorAmt(c)>0){c.payLiv=arg.pay;c.payLivM=doorAmt(c);if(arg.pay!=='cash')c.payOk=false;}}
  if(act==='payok'){if(arg.w==='rec'){if(arg.v)c.payRecOk=true;else{c.payRec='cash';c.payRecNon=true;c.payRecOk=false;}}
    else if(arg.v)c.payOk=true;else{c.payLiv='cash';c.payNon=true;c.payOk=false;}}
  if(act==='envoyer'){c.lid=arg.lid;if(c.statut==='nouvelle'){c.statut='prise';t.prise=now;}}
  if(act==='annuler')c.statut='annulee';
  if(act==='rendu')c.rendu=true;
  if(act==='modifier')Object.assign(c,arg);
  c.t=t;}
async function mdo(act,id,arg,msg){
  optim(act,id,arg);renderKeep();
  if(!navigator.onLine){MQ.push({act,id,arg});lsSet('tl-mq',MQ);netBar();toast('Enregistré : envoyé quand internet revient');return true;}
  try{const v=await mcall(act,id,arg);if(v&&v.ok)setMV(v);renderKeep();if(msg)toast(msg);return true;}
  catch(e){if(isNet(e)){MQ.push({act,id,arg});lsSet('tl-mq',MQ);netBar();toast('Enregistré : envoyé quand internet revient');return true;}
    toast(errMsg(e));await mRefresh();return false;}
}
async function replayMQ(){if(MODE!=='membre'||!SB)return;while(MQ.length&&navigator.onLine){const q=MQ[0];
    try{const v=await mcall(q.act,q.id,q.arg);MQ.shift();lsSet('tl-mq',MQ);if(v&&v.ok)setMV(v);}
    catch(e){if(isNet(e))break;MQ.shift();lsSet('tl-mq',MQ);toast('Non enregistré : '+errMsg(e));}}
  netBar();renderKeep();}
function startMembre(){MODE='membre';vueToS();render();if(!SB)return;replayMQ().then(()=>mRefresh(false));
  clearInterval(MPOLL);MPOLL=setInterval(()=>{if(document.visibilityState==='visible')replayMQ().then(()=>mRefresh(true));},12000);pushCheck();}

// ===== Actions du capo et du capo de zone (mêmes écrans) =====
function courseNeedsCode(march){const cv=S.ent.codeLiv||'vendeur';return cv==='toujours'||(cv==='vendeur'&&+march>0);}
async function doNewCourse(o,lid){
  if(isZoneMgr()){const a=Object.assign({},o,{lid:lid||''});const ok=await mdo('creer','',a,lid?'Course envoyée à '+(lv(lid)||{}).nom:'Course enregistrée');return ok;}
  const id=uid(),now=Date.now();
  const c=Object.assign({id,src:'tel',type:'colis',cli:{nom:'',tel:''},de:'',a:'',dest:{nom:'',tel:''},note:'',prix:0,paie:'exp',mode:'cash',march:0,statut:'nouvelle',lid:'',rendu:false},o,
    {t:{cree:now},ctk:rnd(16),dtk:rnd(16),cl:courseNeedsCode(o.march)?pin4():'',par:'capo'});
  if(MODE==='demo')c.no=(Math.max(1000,...L('courses').map(x=>+x.no||0))+1);

// ===== Paiement à la livraison : espèces, ou Wave / Orange Money sur le numéro du patron =====
const doorAmt=c=>(c.paie==='dest'?+c.prix||0:0)+(+c.march||0);   // ce que celui qui reçoit paie à la porte
const payWait=c=>!!c.payLiv&&c.payLiv!=='cash'&&!c.payOk;          // Wave / OM pas encore vérifié par le patron
const payDig=c=>!!c.payLiv&&c.payLiv!=='cash'&&!!c.payOk;          // Wave / OM vérifié : l'argent est chez le patron
const recWait=c=>!!c.payRec&&c.payRec!=='cash'&&!c.payRecOk;       // pareil au ramassage, quand l'expéditeur paie
const recSheetOk=c=>c.paie!=='dest'&&+c.prix>0&&payOpts().length>1;
function payOpts(){const e=S.ent||{};return [['cash','💵 Espèces']].concat(e.wave||imgOk(e.qrWave)?[['wave','📱 Wave']]:[]).concat(e.om||imgOk(e.qrOm)?[['om','📱 Orange Money']]:[]);}
// ===== Caisse : ce que chaque livreur doit verser =====
function caisse(l,date){
  const cs=L('courses').filter(c=>c.lid===l.id&&c.statut==='livree'&&dayOf(c.t&&c.t.livree)===date);
  // prix déjà chez le patron : payé par Wave / OM au départ (ancienne façon), ou à la porte et vérifié
  const dPx=c=>c.paie==='dest'?(c.payLiv?payDig(c):c.mode!=='cash'):(c.payRec?c.payRec!=='cash'&&!!c.payRecOk:c.mode!=='cash');
  const dP=sum(cs,c=>dPx(c)?+c.prix||0:0),dM=sum(cs.filter(payDig),c=>+c.march);
  const wl=cs.filter(recWait).map(c=>({c,w:'rec',m:+c.payRecM||+c.prix||0})).concat(cs.filter(payWait).map(c=>({c,w:'liv',m:+c.payLivM||doorAmt(c)})));
  const total=sum(cs,c=>+c.prix),digital=dP+dM,march=sum(cs,c=>+c.march),wait=sum(wl,x=>x.m);
  const p=l.paie||{t:'pct',v:30};let partL,partP;
  if(p.t==='pct'){partL=Math.round(total*(+p.v||0)/100);partP=total-partL;}
  else if(p.t==='jour'){partP=cs.length?(+p.v||0):0;partL=total-partP;}
  else{partL=0;partP=total;}
  const aVerser=partP-digital+march;
  const v=L('versements').find(x=>x.lid===l.id&&x.date===date);
  return {cs,total,digital,dP,dM,march,partL,partP,aVerser,v,wl,wait};
}
// versement du jour : déjà versé, et ce qui reste si d'autres courses sont arrivées après
function verseInfo(k){const v=k.v;if(!v)return {v:null,paid:0,reste:k.aVerser};const paid=+v.montant||0;return {v,paid,reste:k.aVerser-paid};}
// rapport du mois pour chaque livreur / moto
function rapport(l,mois){
  const cs=L('courses').filter(c=>c.lid===l.id&&c.statut==='livree'&&dayOf(c.t&&c.t.livree).slice(0,7)===mois);
  const total=sum(cs,c=>+c.prix),jours=new Set(cs.map(c=>dayOf(c.t.livree))).size;const p=l.paie||{t:'pct',v:30};
  const partL=p.t==='pct'?Math.round(total*(+p.v||0)/100):p.t==='jour'?Math.max(0,total-(+p.v||0)*jours):(+p.v||0);
  const dep=sum(L('depenses').filter(d=>d.lid===l.id&&String(d.date||'').slice(0,7)===mois),d=>+d.montant);
  return {n:cs.length,total,jours,partL,dep,benef:total-partL-dep};
}

function soloActions(c,open){let h='';const aRec=c.paie!=='dest'&&(c.mode==='cash'||recSheetOk(c))?+c.prix||0:0,aLiv=(c.mode==='cash'&&c.paie==='dest'?+c.prix||0:0)+(+c.march||0);

function courseCard(c,ctx){
  const l=lv(c.lid);const st=ST[c.statut]||ST.nouvelle;const open=c.statut!=='annulee'&&c.statut!=='livree';
  let h='<article class="course s-'+c.statut+'"><div class="c-head"><span class="c-no">N° '+(c.no||'…')+'</span><span class="c-meta">'+(c.vocal?'🎤 Vocal':SRC[c.src]||'')+' · '+hhmm(c.t&&c.t.cree)+(zones().length>1&&!V.zf?' · '+esc(c.zone):'')+'</span><span class="pill '+st.cls+'">'+st.t+'</span></div>';
  h+='<div style="font-weight:800">'+(c.type==='personne'?'🛵 Transport de personne':'📦 Colis')+'</div>'+routeHtml(c)+vocalHtml(c)+moneyHtml(c,ctx!=='capo')+contactHtml(c,open);
  if(ctx==='capo'&&solo())return h+soloActions(c,open)+'</article>';
  if(ctx==='capo'){
    if(c.prixLiv)h+=prixLivHtml(c);
    h+=payLine(c,true);
    if(c.cl&&open)h+='<div class="small">🔐 Code de livraison : <b class="code">'+esc(c.cl)+'</b> <span class="muted">(celui qui reçoit le donne au livreur)</span></div>';
    if(l)h+='<div class="who"><span>🛵 <b>'+esc(l.nom)+'</b>'+(c.statut==='livree'?' · livré à '+hhmm(c.t.livree):c.statut==='recuperee'?' · récupéré à '+hhmm(c.t.recup):c.statut==='prise'?' · parti à '+hhmm(c.t.prise):'')+'</span>'+(c.photo?'<button class="b b-line b-sm" data-a="photo" data-id="'+c.id+'">📷 Photo</button>':'')+'</div>';
    h+='<div class="row">';
    if(c.statut==='nouvelle')h+='<button class="b b-sun" data-a="assign" data-id="'+c.id+'">🛵 Envoyer à un livreur</button>';
    if(actif(c))h+='<button class="b b-line" data-a="assign" data-id="'+c.id+'">Changer de livreur</button>';
    if(c.statut==='livree'&&+c.march&&!c.rendu)h+='<button class="b b-go" data-a="rendu" data-id="'+c.id+'">Argent rendu au vendeur ✓</button>';
    h+='</div><div class="row">';
    if(c.statut!=='annulee')h+='<button class="b b-line b-sm" data-a="edit" data-id="'+c.id+'">✏️ Modifier</button><button class="b b-line b-sm" data-a="recu" data-id="'+c.id+'">🧾 Reçu</button>';
    if(open&&c.dest&&c.dest.tel&&c.dtk)h+='<button class="b b-line b-sm" data-a="destLink" data-id="'+c.id+'">📍 Lien position</button>';
    if(actif(c))h+='<button class="b b-line b-sm" data-a="stepCapo" data-id="'+c.id+'">'+(c.statut==='prise'?'Marquer récupéré':'Marquer livré')+'</button>';
    if(open)h+='<button class="b b-bad b-sm" data-a="cancel" data-id="'+c.id+'">Annuler</button>';
    h+='</div>';
    if(c.statut==='nouvelle'&&libreOk())h+='<div class="hint">Les livreurs disponibles de '+esc(c.zone)+' la voient aussi : le premier qui touche « Je prends » la reçoit.</div>';
  }else if(ctx==='libre'){
    h+='<button class="b b-go b-big" data-a="take" data-id="'+c.id+'">✋ JE PRENDS</button>';
  }else if(ctx==='mine'){
    const q=c.statut==='prise'?c.de:c.a,pos=c.statut==='prise'?c.depos:c.apos;
    if(q||posOk(pos))h+='<a class="b b-line" href="'+mapLink(q,c.zone,pos)+'" target="_blank" rel="noopener">🗺️ Itinéraire'+(posOk(pos)?' (position exacte)':' vers « '+esc(q)+' »')+'</a>';
    const aRec=c.paie!=='dest'&&(c.mode==='cash'||recSheetOk(c))?+c.prix||0:0,aLiv=(c.mode==='cash'&&c.paie==='dest'?+c.prix||0:0)+(+c.march||0);
    if(c.statut==='prise')h+='<button class="b b-pick b-big" data-a="mstep" data-v="recup" data-id="'+c.id+'">📦 RÉCUPÉRÉ'+(aRec>0?' · j\'encaisse '+F(aRec):'')+'</button>';
    if(c.statut==='recuperee')h+='<button class="b b-done b-big" data-a="mlivre" data-id="'+c.id+'">✅ LIVRÉ'+(aLiv>0?' · j\'encaisse '+F(aLiv):'')+'</button>';
  }
  return h+'</article>';
}

function capoCourses(app){
  const cs=L('courses').filter(inZone);
  const nouv=cs.filter(c=>c.statut==='nouvelle'),enc=cs.filter(actif),liv=cs.filter(c=>c.statut==='livree'&&dayOf(c.t.livree)===today());
  const FL=[['actives','À faire',nouv.length+enc.length],['nouvelles','Nouvelles',nouv.length],['livrees',"Livrées aujourd'hui",liv.length],['toutes','Toutes',cs.length]];
  let list=V.cf==='nouvelles'?nouv:V.cf==='livrees'?liv:V.cf==='toutes'?cs:nouv.concat(enc);
  const ord={nouvelle:0,prise:1,recuperee:2,livree:3,annulee:4};
  list=list.slice().sort((a,b)=>ord[a.statut]-ord[b.statut]||(b.t.cree||0)-(a.t.cree||0));
  if(V.cf==='toutes')list=list.slice(0,150);
  const dispo=livreurs().filter(l=>l.dispo&&inZone(l)).length;
  app.innerHTML=accBanner()+'<div class="tiles"><div class="tile"><div class="k">Nouvelles</div><div class="v">'+nouv.length+'</div></div><div class="tile"><div class="k">En route</div><div class="v">'+enc.length+'</div></div>'+(solo()?'<div class="tile"><div class="k">Livrées aujourd\'hui</div><div class="v">'+liv.length+'</div></div>':'<div class="tile"><div class="k">Livreurs dispo</div><div class="v">'+dispo+'</div></div>')+'</div>'+
    '<div style="margin-top:12px"><button class="b b-sun b-big" data-a="new">＋ Nouvelle course</button></div>'+
    '<div class="filters" role="group" aria-label="Filtrer">'+FL.map(([k,x,n])=>'<button data-a="cf" data-v="'+k+'" aria-pressed="'+(V.cf===k)+'">'+x+' · '+n+'</button>').join('')+'</div>'+
    '<div class="list">'+(list.length?list.map(c=>courseCard(c,'capo')).join(''):'<div class="empty">Aucune course ici pour le moment.<br>Touchez « Nouvelle course » quand un client appelle ou passe au dépôt. Les demandes du lien clients arrivent ici toutes seules.</div>')+'</div>';
}

// enregistrement du vocal (débit bas pour un petit fichier)
let MR=null,recTimer=null,recT0=0;
async function recStart(){
  try{if(!navigator.mediaDevices||!window.MediaRecorder)throw new Error('no');
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
    const opt={audioBitsPerSecond:24000};if(mt)opt.mimeType=mt;MR=new MediaRecorder(st,opt);const ch=[];
    MR.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};
    MR.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(recTimer);const dur=Math.max(1,Math.round((Date.now()-recT0)/1000));
      const b=new Blob(ch,{type:MR.mimeType||mt||'audio/mp4'});const fr=new FileReader();fr.onload=()=>{PV.vocal={url:fr.result,mime:(MR.mimeType||mt||'audio/mp4').split(';')[0],dur:Math.min(60,dur)};PV.rec=false;renderPublic();};fr.readAsDataURL(b);};
    MR.start(1000);recT0=Date.now();PV.rec=true;PV.micErr=false;PV.recSec=0;renderPublic();
    recTimer=setInterval(()=>{PV.recSec=Math.min(60,Math.floor((Date.now()-recT0)/1000));const t=document.querySelector('.timer');if(t)t.textContent='0:'+pad(Math.min(59,PV.recSec))+' / 1:00';if(PV.recSec>=60)recStop();},250);
  }catch(e){const n=e&&e.name||'';PV.micErr=e&&e.message==='no'?'app':/NotFound|DevicesNotFound/.test(n)?'nodev':'deny';PV.rec=false;renderPublic();}
}
function recStop(){try{if(MR&&MR.state!=='inactive')MR.stop();}catch(e){}}

// ----- icône de l'écran d'accueil : pour un livreur, elle s'ouvre sur l'espace de sa société -----
function livHome(code){if(!code)return;try{const base=location.href.split(/[?#]/)[0].replace(/(index|commande)\.html$/,''),url=base+'?livreur='+encodeURIComponent(code);
  if(Q.get('livreur')!==code)history.replaceState(null,'',url);
  const ic=s=>({src:base+'icon-'+s+'.png',sizes:s+'x'+s,type:'image/png'});
  const mf={name:'Livraison · Espace livreur',short_name:'Livreur',start_url:url,scope:base,display:'standalone',background_color:'#EDF0F5',theme_color:'#0E2A57',lang:'fr',
    icons:[ic(192),ic(512),{src:base+'icon-maskable-512.png',sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  document.querySelectorAll('link[rel="manifest"]').forEach(l=>l.remove());
  const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));document.head.appendChild(l);
  const t=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(t)t.content='Livreur';}catch(e){}}
// ===== Démarrage : on choisit l'écran selon le lien =====
function boot(){
  initSB();
  if('serviceWorker' in navigator&&location.protocol==='https:')swReady().catch(()=>{});
  // page des clients et page de celui qui reçoit
  if(PAGE==='commande'||Q.get('c')){
    if(!CCODE){MODE='start';render();return;}
    if(Q.get('d')&&Q.get('k')){MODE='dest';render();whenSB(destLoad);
      setInterval(()=>{if(document.visibilityState==='visible'&&DST&&DST.ok&&DST.statut!=='livree'&&DST.statut!=='annulee')destLoad();},30000);return;}
    MODE='public';render();whenSB(pubLoad);
    setInterval(()=>{if(document.visibilityState==='visible'&&MODE==='public'&&!PV.rec&&MINE.some(m=>!m.fin))pubSuivi();},20000);return;
  }
  // lien d'accès d'un livreur ou d'un capo de zone
  const lc=codeOf(Q.get('livreur')||'');if(lc)livHome(lc);else if(MEM&&!lsGet('tl-auth',null))livHome(MEM.code);
  if(lc&&!(MEM&&MEM.code===lc)){MODE='mlogin';V.mlog.code=lc;render();return;}
  if(lc||(!lsGet('tl-auth',null)&&MEM)){
    if(MV){startMembre();return;}
    MODE='mlogin';render();
    whenSB(async()=>{try{const v=await mLogin(MEM.code,MEM.tel,MEM.pin);if(v&&v.ok){setMV(v);startMembre();}else{lsDel('tl-mem');MEM=null;render();}}catch(e){if(/fermé/i.test(String(e.message||''))){MODE='locked';render();}}});
    return;
  }
  // capo connecté (marche aussi sans internet avec les données gardées)
  const st=lsGet('tl-auth',null);
  if(st&&st.user){USER=st.user;startCapo();
    whenSB(async()=>{try{const r=await SB.auth.getSession();if(r.data&&r.data.session){USER=r.data.session.user;return;}
        if(!r.error&&navigator.onLine){clearInterval(PULLT);USER=null;MODE='auth';V.auth.su=false;render();toast('Entrez de nouveau avec votre mot de passe');}}catch(e){}});
    return;}
  if(MEM&&MV){startMembre();return;}
  MODE='start';render();
}
boot();
